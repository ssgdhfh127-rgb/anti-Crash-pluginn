name: Build Java to JAR

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile and Package
      run: |
        mkdir -p build
        javac -d build AntiCrashPro.java
        jar cf best-anti-crash.jar -C build .

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: best-anti-crash-JAR
        path: best-anti-crash.jar
