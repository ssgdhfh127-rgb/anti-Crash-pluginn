name: Build Java to JAR

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java & Create JAR
      run: |
        javac *.java
        jar cvfe best-anti-crash.jar AntiCrashPro *.class

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: best-anti-crash-JAR
        path: best-anti-crash.jar
